name: Scraper smoke

# The unit tests run against recorded fixtures, so a job board can change
# its markup or API and every check stays green while production quietly
# scrapes nothing. This hits the real endpoints daily and opens an issue
# when an adapter stops returning usable jobs.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install -U pip
          pip install httpx "beautifulsoup4>=4.12" "pandas>=2.0" python-dotenv

      - name: Probe every adapter against the live endpoints
        id: smoke
        run: |
          set -o pipefail
          python scripts/smoke_scrapers.py 2>&1 | tee smoke.log

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Scraper smoke'
            echo '```'
            tail -n 40 smoke.log || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when a source is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no log captured)';
            try { log = fs.readFileSync('smoke.log', 'utf8').slice(-6000); } catch (e) {}

            const title = 'Scraper smoke failing — at least one source returns no jobs';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper-health',
            });

            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'A live probe of the scraper adapters failed. Production is most',
              'likely delivering fewer jobs than it should — check',
              '`gosha/scrapers/` for the named source.',
              '',
              '```',
              log,
              '```',
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['scraper-health'],
              });
            }
